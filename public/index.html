<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Online Shopping and Order Management</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Online Shopping and Order Management System</h1><p>Browse products, manage cart and place orders</p></header><main>
<section class="panel"><h2>Customer registration</h2><input id="customerName" placeholder="Customer name"><input id="customerEmail" type="email" placeholder="Email"><button onclick="register()">Register</button><span id="customerStatus">No customer selected</span></section>
<section class="panel"><h2>Product catalogue and search</h2><input id="search" placeholder="Search products"><button onclick="loadProducts()">Search</button><div id="products"></div></section>
<section class="panel"><h2>Shopping cart</h2><div id="cart"></div><button onclick="checkout()">Checkout / Place order</button></section>
<section class="panel"><h2>Order history</h2><div id="orders"></div></section>
<section class="panel"><h2>Admin product management</h2><input id="productId" type="hidden"><input id="productName" placeholder="Product name"><input id="price" type="number" min="1" placeholder="Price ₹"><input id="stock" type="number" min="0" placeholder="Stock"><button onclick="saveProduct()">Add / Update product</button><button class="secondary" onclick="clearProduct()">Clear</button></section><p id="msg" role="status"></p></main><script src="app.js"></script></body></html>
